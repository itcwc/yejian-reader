name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, nothing to do."
            exit 0
          fi
          notes=".github/release-notes/${tag}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --title "页间 ${tag}" --notes-file "$notes" --latest --verify-tag
          else
            gh release create "$tag" --title "页间 ${tag}" --generate-notes --latest --verify-tag
          fi
