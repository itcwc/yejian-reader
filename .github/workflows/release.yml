name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes=".github/release-notes/${tag}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            if [ -f "$notes" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
            exit 0
          fi
          if [ -f "$notes" ]; then
            gh release create "$tag" --title "页间 ${tag}" --notes-file "$notes" --latest
          else
            gh release create "$tag" --title "页间 ${tag}" --generate-notes --latest
          fi

  windows:
    name: Windows installer
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Electron installer
        run: npm run build:pc

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' } |
            ForEach-Object { gh release upload $tag $_.FullName --clobber }

  android:
    name: Android APK
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets
        run: npm run build:android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK
        run: |
          set -euo pipefail
          java -version
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager: ${SDKMANAGER:-missing}"
          echo "ANDROID_HOME: ${ANDROID_HOME:-missing}"
          if [ -n "${SDKMANAGER:-}" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "sdk.dir=$ANDROID_HOME" > android-webview/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Gradle version
        run: gradle -v

      - name: Build debug APK
        run: gradle -p android-webview assembleDebug --no-daemon

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          apk="yejian-v${version}-android-debug.apk"
          cp android-webview/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release upload "$tag" "$apk" --clobber

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          apk="yejian-v${version}-android-debug.apk"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          url="https://github.com/itcwc/yejian-reader/releases/download/${tag}/${apk}"
          VERSION="$version" APK_URL="$url" APK_SHA="$sha" node -e '
            const fs = require("node:fs")
            fs.writeFileSync("update.json", JSON.stringify({
              version: process.env.VERSION,
              publishedAt: new Date().toISOString(),
              android: { url: process.env.APK_URL, sha256: process.env.APK_SHA }
            }, null, 2) + "\n")
          '
          gh release upload "$tag" update.json --clobber
