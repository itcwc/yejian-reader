name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes=".github/release-notes/${tag}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            if [ -f "$notes" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
            exit 0
          fi
          if [ -f "$notes" ]; then
            gh release create "$tag" --title "页间 ${tag}" --notes-file "$notes" --latest
          else
            gh release create "$tag" --title "页间 ${tag}" --generate-notes --latest
          fi

  windows:
    name: Windows installer
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Electron installer
        shell: pwsh
        run: |
          npm run build:pc *>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml' } |
            ForEach-Object { gh release upload $tag $_.FullName --clobber }

      - name: Publish Windows build log
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "ci-log-${{ github.run_id }}-windows"
          git add -f windows-build.log || true
          git commit -m "ci: windows build log" || true
          git push origin "HEAD:ci-log-${{ github.run_id }}-windows" || true

  android:
    name: Android APK
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets
        run: npm run build:android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Point Gradle at SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android-webview/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android-webview assembleDebug --no-daemon 2>&1 | tee android-build.log

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          apk="yejian-v${version}-android-debug.apk"
          cp android-webview/app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release upload "$tag" "$apk" --clobber

      - name: Publish Android build log
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "ci-log-${{ github.run_id }}-android"
          git add -f android-build.log || true
          git commit -m "ci: android build log" || true
          git push origin "HEAD:ci-log-${{ github.run_id }}-android" || true
