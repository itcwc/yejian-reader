name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README*.md'
      - 'readme/**'
      - 'docs/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-macos-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.prepare.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create GitHub release if missing
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          notes=".github/release-notes/${tag}.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists."
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -f "$notes" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--draft --target "$GITHUB_SHA" --title "页间 ${tag}")
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" "${args[@]}"
          echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Electron installer
        run: npm run build:pc

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = "yejian-v${version}-windows-x64.exe"
          gh release upload $tag "release/$installer" "release/$installer.blockmap" "release/latest.yml" --clobber
          exit $LASTEXITCODE

  android:
    name: Android APK
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets
        run: npm run build:android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK
        run: |
          set -euo pipefail
          java -version
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager: ${SDKMANAGER:-missing}"
          echo "ANDROID_HOME: ${ANDROID_HOME:-missing}"
          if [ -n "${SDKMANAGER:-}" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "sdk.dir=$ANDROID_HOME" > android-webview/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show Gradle version
        run: gradle -v

      - name: Build and verify signed release APK
        env:
          YEJIAN_ANDROID_KEYSTORE_BASE64: ${{ secrets.YEJIAN_ANDROID_KEYSTORE_BASE64 }}
          YEJIAN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YEJIAN_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${YEJIAN_ANDROID_KEYSTORE_BASE64:?Missing Android release keystore secret}"
          : "${YEJIAN_ANDROID_KEYSTORE_PASSWORD:?Missing Android release keystore password secret}"
          umask 077
          export YEJIAN_ANDROID_KEYSTORE="$(mktemp "$RUNNER_TEMP/yejian-release.XXXXXX")"
          trap 'rm -f -- "$YEJIAN_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$YEJIAN_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$YEJIAN_ANDROID_KEYSTORE"
          unset YEJIAN_ANDROID_KEYSTORE_BASE64
          gradle -p android-webview assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            android-webview/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          apk="yejian-v${version}-android.apk"
          cp android-webview/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$tag" "$apk" --clobber

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          apk="yejian-v${version}-android.apk"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          url="https://github.com/itcwc/yejian-reader/releases/download/${tag}/${apk}"
          VERSION="$version" APK_URL="$url" APK_SHA="$sha" node -e '
            const fs = require("node:fs")
            fs.writeFileSync("android-release-update.json", JSON.stringify({
              version: process.env.VERSION,
              publishedAt: new Date().toISOString(),
              android: { url: process.env.APK_URL, sha256: process.env.APK_SHA }
            }, null, 2) + "\n")
          '
          gh release upload "$tag" android-release-update.json --clobber

  publish:
    name: Publish release
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$tag" --draft=false --latest
          fi
