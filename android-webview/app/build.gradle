plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yejian.reader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yejian.reader'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '0.1.9'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/yejian-debug.jks')
            storePassword 'yejian123'
            keyAlias 'yejiandebug'
            keyPassword 'yejian123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
